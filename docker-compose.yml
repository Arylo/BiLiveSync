version: "3.9"

services:
  server:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev --workspace @bilivesync/server"
    volumes:
      - ./:/app
    environment:
      NODE_ENV: development
      DATABASE_URL: file:/data/bilivesync.db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: bilivesync
      MINIO_SECRET_KEY: bilivesync123
    ports:
      - "3000:3000"
    depends_on:
      - minio

  admin:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev --workspace @bilivesync/admin"
    volumes:
      - ./:/app
    ports:
      - "5173:5173"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bilivesync
      MINIO_ROOT_PASSWORD: bilivesync123
    ports:
      - "9000:9000"
      - "9001:9001"
